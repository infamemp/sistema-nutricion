<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: "#f1f9eb",
                            100: "#deefd1",
                            400: "#93c66b",
                            600: "#65a035",
                            700: "#518329",
                            800: "#395b1e"
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm p-6">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-medium text-green-800">Recuperar contraseña</h1>
            <p class="text-sm text-gray-500 mt-1">Se enviará un enlace de un solo uso</p>
        </div>

        {% if mensaje %}
        <div class="bg-green-100 border border-green-300 text-green-800 text-sm rounded-lg p-3 mb-4">
            {{ mensaje }}
        </div>
        {% endif %}

        <form method="post" action="/olvide-password" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <p class="text-sm text-gray-600">
                Al continuar, se enviará un enlace de recuperación al correo configurado para restablecimientos.
            </p>
            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                Enviar enlace
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/login" class="text-sm text-green-700 hover:underline">Volver a iniciar sesión</a>
        </div>

    </div>

</body>
</html>
