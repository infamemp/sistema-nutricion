<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen">

    <div class="max-w-4xl mx-auto p-6">

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-medium text-green-800">Pacientes</h1>
            <a href="/pacientes/nuevo"
               class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                Nuevo paciente
            </a>
        </div>

        {% if pacientes %}
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-green-100 text-green-800">
                    <tr>
                        <th class="text-left px-4 py-3 font-medium">Nombre</th>
                        <th class="text-left px-4 py-3 font-medium">Celular</th>
                        <th class="text-left px-4 py-3 font-medium">Correo</th>
                        <th class="text-left px-4 py-3 font-medium">Referido por</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in pacientes %}
                    <tr class="border-t border-gray-100">
                        <td class="px-4 py-3 text-gray-800">{{ p.nombre_completo }}</td>
                        <td class="px-4 py-3 text-gray-600">{{ p.celular or "" }}</td>
                        <td class="px-4 py-3 text-gray-600">{{ p.correo_electronico or "" }}</td>
                        <td class="px-4 py-3 text-gray-600">{{ p.referido_por or "" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="bg-white rounded-xl shadow-sm p-8 text-center">
            <p class="text-gray-500">Todavía no hay pacientes registrados.</p>
        </div>
        {% endif %}

    </div>

</body>
</html>
