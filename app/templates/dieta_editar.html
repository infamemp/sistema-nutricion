<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar dieta - {{ paciente.nombre_completo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen pb-24">

    <div class="max-w-3xl mx-auto p-6">

        <div class="mb-4">
            <a href="/pacientes/{{ paciente.id }}/dieta/{{ dieta.id }}" class="text-sm text-green-700 hover:underline">&larr; Cancelar y volver</a>
        </div>

        <div class="mb-6">
            <h1 class="text-2xl font-medium text-green-800">Editar dieta</h1>
            <p class="text-sm text-gray-600 mt-1">{{ paciente.nombre_completo }} &middot; versión {{ dieta.version }}</p>
            <p class="text-xs text-gray-400 mt-1">Una idea por línea en cada campo de texto.</p>
        </div>

        <form method="post" action="/pacientes/{{ paciente.id }}/dieta/{{ dieta.id }}/editar" class="space-y-6">

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-medium text-green-700 border-b-2 border-blue-500 pb-2 mb-4">Objetivos clave</h2>
                <textarea name="objetivos_clave" rows="8" placeholder="Un objetivo por línea"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 resize-y">{{ objetivos_texto }}</textarea>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-medium text-green-700 border-b-2 border-blue-500 pb-2 mb-4">Suplementación</h2>
                <textarea name="suplementacion" rows="6" placeholder="Un suplemento por línea"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 resize-y">{{ suplementacion_texto }}</textarea>
            </div>

            {% for tiempo in tiempos_menu %}
            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-medium text-green-700 border-b-2 border-blue-500 pb-2 mb-4">{{ tiempo|upper }}</h2>
                <div class="mb-3">
                    <label class="block text-sm text-gray-700 mb-1">Encabezado (opcional)</label>
                    <input type="text" name="encabezado_{{ tiempo }}" value="{{ campos_menu[tiempo].encabezado }}"
                           placeholder="Ej. Elige una opción y acompaña con agua natural"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Opciones</label>
                    <textarea name="opciones_{{ tiempo }}" rows="10" placeholder="Una opción completa por línea, con cantidades"
                              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 resize-y">{{ campos_menu[tiempo].opciones_texto }}</textarea>
                </div>
            </div>
            {% endfor %}

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h2 class="text-lg font-medium text-green-700 border-b-2 border-blue-500 pb-2 mb-4">Recomendaciones</h2>
                <textarea name="recomendaciones" rows="8" placeholder="Una recomendación por línea"
                          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400 resize-y">{{ recomendaciones_texto }}</textarea>
            </div>

            <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg">
                <div class="max-w-3xl mx-auto flex gap-3">
                    <a href="/pacientes/{{ paciente.id }}/dieta/{{ dieta.id }}"
                       class="flex-1 text-center border border-gray-300 text-gray-700 font-medium py-3 rounded-lg hover:bg-gray-50 transition">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                        Guardar cambios
                    </button>
                </div>
            </div>

        </form>

    </div>

</body>
</html>
