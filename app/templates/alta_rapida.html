<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta rápida de paciente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: "#f1f9eb",
                            100: "#deefd1",
                            400: "#93c66b",
                            600: "#65a035",
                            700: "#518329",
                            800: "#395b1e"
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-green-50 min-h-screen">

    <div class="max-w-2xl mx-auto p-6">

        <div class="mb-6">
            <h1 class="text-2xl font-medium text-green-800">Alta rápida de paciente</h1>
            <p class="text-sm text-gray-600 mt-1">Datos básicos y primera cita. La historia clínica se llena después, en consulta.</p>
        </div>

        {% if mensaje %}
        <div class="bg-green-100 border border-green-300 text-green-800 rounded-lg p-4 mb-6">
            {{ mensaje }}
        </div>
        {% endif %}

        <form data-autoguardar method="post" action="/pacientes/alta" class="space-y-6">

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <h2 class="text-lg font-medium text-green-800 bg-green-100 border-b-2 border-blue-500 px-6 py-3">Datos del paciente</h2>

                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo *</label>
                        <input type="text" name="nombre_completo" required
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Celular</label>
                            <input type="tel" name="celular"
                                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
                            <input type="email" name="correo_electronico"
                                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento"
                                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
                            <select name="sexo"
                                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                                <option value="">Sin especificar</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Masculino">Masculino</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Motivo de la consulta</label>
                        <textarea name="motivo_consulta" rows="2"
                                  class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Referido por</label>
                        <input type="text" name="referido_por" placeholder="Nombre del médico, o cómo llegó"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Origen de la consulta</label>
                        <div class="flex gap-6 mt-1">
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="radio" name="origen_consulta" value="privado" checked class="text-green-600 focus:ring-green-400">
                                Privado
                            </label>
                            <label class="flex items-center gap-2 text-sm text-gray-700">
                                <input type="radio" name="origen_consulta" value="unido" class="text-green-600 focus:ring-green-400">
                                UniDO
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <h2 class="text-lg font-medium text-green-800 bg-green-100 border-b-2 border-blue-500 px-6 py-3">Agendar cita</h2>

                <div class="p-6 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                            <input type="date" name="cita_fecha"
                                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Hora</label>
                            <input type="time" name="cita_hora"
                                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Notas de la cita</label>
                        <input type="text" name="cita_notas" placeholder="Ej. confirmar por WhatsApp"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                    </div>

                    <p class="text-xs text-gray-500">Si no agendas ahora, deja la fecha vacía y podrás agendar después.</p>
                </div>
            </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                    Guardar paciente
                </button>
            </div>

        </form>

        <div class="mt-6 text-center">
            <a href="/pacientes" class="text-sm text-green-700 hover:underline">Ver lista de pacientes</a>
        </div>

    </div>

    <script>
        // Mantiene viva la sesion mientras esta pantalla este abierta
        // (evita el cierre por "1 hora de inactividad" cuando en
        // realidad se esta escribiendo, solo que sin mandar peticiones
        // al servidor).
        setInterval(function () {
            fetch('/ping', { method: 'POST' }).catch(function () {});
        }, 5 * 60 * 1000);

        // Borrador local de respaldo: guarda el formulario en este
        // navegador cada pocos segundos. Si la sesion se pierde o se
        // cierra la pestaña antes de guardar, al volver a abrir esta
        // misma pantalla se puede recuperar.
        (function () {
            var form = document.querySelector('form[data-autoguardar]');
            if (!form) return;

            var clave = 'borrador:' + window.location.pathname;

            function leerFormulario() {
                var datos = {};
                Array.from(form.elements).forEach(function (el) {
                    if (!el.name) return;
                    if (el.type === 'checkbox' || el.type === 'radio') {
                        if (el.checked) datos[el.name] = el.value;
                    } else {
                        datos[el.name] = el.value;
                    }
                });
                return datos;
            }

            function guardarBorrador() {
                localStorage.setItem(clave, JSON.stringify({ fecha: Date.now(), datos: leerFormulario() }));
            }

            function aplicarBorrador(datos) {
                Array.from(form.elements).forEach(function (el) {
                    if (!el.name || !(el.name in datos)) return;
                    if (el.type === 'checkbox' || el.type === 'radio') {
                        el.checked = (el.value === datos[el.name]);
                    } else {
                        el.value = datos[el.name];
                    }
                });
            }

            function mostrarAvisoBorrador(payload) {
                var minutos = Math.max(1, Math.round((Date.now() - payload.fecha) / 60000));
                var aviso = document.createElement('div');
                aviso.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:50;background:#fef3c7;border-bottom:1px solid #f59e0b;padding:12px 16px;font-size:14px;color:#78350f;text-align:center;';
                aviso.innerHTML = 'Se encontró un borrador sin guardar de hace ' + minutos + ' min. ' +
                    '<button type="button" id="btn-recuperar-borrador" style="margin-left:8px;background:#f59e0b;color:white;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;">Recuperar</button> ' +
                    '<button type="button" id="btn-descartar-borrador" style="margin-left:6px;background:white;border:1px solid #f59e0b;padding:4px 10px;border-radius:6px;cursor:pointer;">Descartar</button>';
                document.body.prepend(aviso);
                document.getElementById('btn-recuperar-borrador').addEventListener('click', function () {
                    aplicarBorrador(payload.datos);
                    aviso.remove();
                });
                document.getElementById('btn-descartar-borrador').addEventListener('click', function () {
                    localStorage.removeItem(clave);
                    aviso.remove();
                });
            }

            var guardado = localStorage.getItem(clave);
            if (guardado) {
                try {
                    mostrarAvisoBorrador(JSON.parse(guardado));
                } catch (e) {
                    localStorage.removeItem(clave);
                }
            }

            var temporizador;
            form.addEventListener('input', function () {
                clearTimeout(temporizador);
                temporizador = setTimeout(guardarBorrador, 2000);
            });

            form.addEventListener('submit', function () {
                localStorage.removeItem(clave);
            });
        })();
    </script>

    <script>
        function autoCrecer(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
        document.querySelectorAll('textarea').forEach(function(el) {
            el.addEventListener('input', function() { autoCrecer(el); });
            autoCrecer(el);
        });
    </script>

</body>
</html>
