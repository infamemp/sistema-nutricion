<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar análisis de laboratorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen">

    <div class="max-w-2xl mx-auto p-6">

        <div class="mb-4">
            <a href="/pacientes/{{ paciente.id }}" class="text-sm text-green-700 hover:underline">&larr; Volver al expediente</a>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h1 class="text-xl font-medium text-green-800 mb-1">Confirmar análisis de laboratorio</h1>
            <p class="text-sm text-gray-500">Paciente: {{ paciente.nombre_completo }}</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h2 class="text-lg font-medium text-green-700 border-b-2 border-blue-500 pb-2 mb-4">Análisis generado por IA</h2>
            <div class="text-sm text-gray-700 whitespace-pre-line leading-relaxed">{{ analisis }}</div>
        </div>

        <form method="post" action="/pacientes/{{ paciente.id }}/laboratorio/guardar">
            <input type="hidden" name="analisis" value="{{ analisis }}">
            <div class="flex gap-3">
                <a href="/pacientes/{{ paciente.id }}"
                   class="flex-1 text-center border border-gray-300 text-gray-700 font-medium py-3 rounded-lg hover:bg-gray-50 transition">
                    Descartar
                </a>
                <button type="submit"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                    Guardar
                </button>
            </div>
        </form>

    </div>

</body>
</html>
