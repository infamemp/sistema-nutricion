<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: "#f1f9eb",
                            100: "#deefd1",
                            400: "#93c66b",
                            600: "#65a035",
                            700: "#518329",
                            800: "#395b1e"
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm p-6">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-medium text-green-800">Elige tu nueva contraseña</h1>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/restablecer-password" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                <input type="password" name="password" required minlength="8" autofocus
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confírmala</label>
                <input type="password" name="password_confirmar" required minlength="8"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>
            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                Guardar nueva contraseña
            </button>
        </form>

    </div>

</body>
</html>
