<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        green: {
                            50: "#f1f9eb",
                            100: "#deefd1",
                            400: "#93c66b",
                            600: "#65a035",
                            700: "#518329",
                            800: "#395b1e"
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm p-6">
        <div class="text-center mb-6">
            <img src="/static/marifer-logo.png" alt="Marifer Utrilla - Nutrición y Salud Hormonal" class="w-48 h-48 mx-auto">
            <p class="text-xs text-gray-400 mt-2">Inicia sesión para continuar</p>
        </div>
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
            {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/login" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required autofocus
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>
            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                Entrar
            </button>
        </form>
        <div class="text-center mt-4">
            <a href="/olvide-password" class="text-sm text-gray-500 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</body>
</html>
